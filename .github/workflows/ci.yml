# CI matrix, all Ubuntu 24.04:
#   [GCC 13, Clang 18] x [Debug, Release], plus Clang 20 Release.
# The Clang 20 leg spans a compiler generation rather than a platform. Nothing
# else in the matrix runs a compiler newer than clang 18, and a defect that only
# a newer one exhibits would otherwise reach a user's build before ours.
# Mirrors the README's standard build settings exactly, -march=native included
# (LINDBLAD_MARCH_NATIVE=ON). CI validates the configuration the project
# actually recommends and the maintainer actually builds; a green run on some
# other configuration says less than it appears to.
#
# The cost is real and is accepted deliberately: hosted runners span hardware
# generations, so the ISA -march=native resolves to varies with whichever
# machine a job lands on. A leg can therefore change its vectorisation, and with
# it the last bits of a floating-point result, with no change to the tree. Read
# a one-test numerical difference between runs against that before reading it as
# a regression, and pin any assertion that cannot tolerate a differently
# vectorised build.
#
# Every dependency is fetched by CMake (FetchContent), so a runner only needs a
# compiler + ninja + an OpenMP runtime (GCC bundles libgomp; clang's libomp is
# separate).
# `build-test-windows` runs only when the dispatch asks for it; see the note on
# that job. Two further jobs run alongside the matrix and do not depend on it:
# `line-endings` (repository hygiene, no compiler needed) and `coverage` (an
# instrumented build whose report is uploaded as an artifact).

name: CI

on:
  # Manual-dispatch only by design: run this on demand from the Actions tab
  # ('Run workflow') or with 'gh workflow run CI'. Automatic push /
  # pull-request triggers are intentionally left off; uncomment the two blocks
  # below to opt back in.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      run_windows:
        description: "Also run the Windows leg"
        type: boolean
        default: false

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # NLopt v2.7.1 generates its C++ and Fortran bindings by running helper
      # scripts through `cmake -P` as build-time custom commands. Each is a fresh
      # CMake process, so it does not inherit the policy floor the project sets
      # for the fetched subprojects, and each script declares a minimum below
      # 3.5, which CMake 4 rejects outright. The environment variable is the one
      # channel those child processes do see. It costs nothing on a runner
      # carrying CMake 3.x and is what keeps one carrying CMake 4 building.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux gcc-13 Debug
            os: ubuntu-24.04
            cxx: g++-13
            build_type: Debug
          - name: linux gcc-13 Release
            os: ubuntu-24.04
            cxx: g++-13
            build_type: Release
          - name: linux clang-18 Debug
            os: ubuntu-24.04
            cxx: clang++-18
            build_type: Debug
          - name: linux clang-18 Release
            os: ubuntu-24.04
            cxx: clang++-18
            build_type: Release
          - name: linux clang-20 Release
            os: ubuntu-24.04
            cxx: clang++-20
            build_type: Release

    steps:
      # v5 majors of checkout/cache are the Node 24 runtime switch (Node 20 is
      # deprecated on runners). Deliberately the lowest Node-24 majors.
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 clang-18 libomp-18-dev
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # Ubuntu 24.04 carries clang-18 in its own repositories; clang 20 comes
      # from apt.llvm.org, which llvm.sh configures. libomp ships separately
      # from the compiler and this project requires it unconditionally
      # (find_package(OpenMP REQUIRED) plus -fopenmp at compile and link).
      - name: Install clang-20
        if: matrix.cxx == 'clang++-20'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libomp-20-dev
          clang++-20 --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER="${{ env.CXX }}"
          -DLINDBLAD_MARCH_NATIVE=ON
          -DLINDBLAD_BUILD_PYTHON=OFF

      # A failed configure prints only the message() text, not the compiler and
      # linker output behind a failed try_compile check, which is what actually
      # identifies the cause. CMake records that detail in its configure log, so
      # surface it here rather than re-running the job blind.
      - name: Dump CMake configure log (on failure)
        if: failure()
        shell: bash
        run: |
          for f in build/CMakeFiles/CMakeConfigureLog.yaml \
                   build/CMakeFiles/CMakeError.log \
                   build/CMakeFiles/CMakeOutput.log; do
            echo "===================== $f ====================="
            if [ -f "$f" ]; then cat "$f"; else echo "(not present)"; fi
          done

      # `-k 0` tells Ninja to keep building after a failure instead of stopping at
      # the first one, so a failing job reports every broken target rather than
      # one per dispatch: a build that dies at target 6 of 273 says nothing
      # about the other 267. The job still fails; only the amount of diagnosis
      # it carries changes.
      - name: Build
        shell: bash
        run: cmake --build build --parallel -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

  # Windows, on request only: tick `run_windows` when dispatching. Its own job
  # rather than a matrix leg, so a dispatch that does not ask for it reports
  # skipped instead of green, and so the Windows-only toolchain setup keeps
  # being parsed on every run rather than rotting inside a comment.
  build-test-windows:
    name: windows clang Release
    if: ${{ inputs.run_windows }}
    runs-on: windows-2022
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      # Puts MSVC's headers/libs on the environment so the Clang driver
      # (windows-msvc target) can find them.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # The MSVC dev environment above prepends Visual Studio's own bundled LLVM
      # to PATH, so a bare `clang++` resolves there. That toolchain carries no
      # OpenMP runtime, which this project requires unconditionally
      # (find_package(OpenMP REQUIRED) plus -fopenmp at compile and link), so
      # the build is pointed at the standalone LLVM distribution instead: it
      # ships libomp and makes the compiler choice explicit rather than
      # PATH-order dependent.
      - name: Install toolchain
        shell: pwsh
        run: |
          choco install ninja llvm --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\clang++.exe")) {
            throw "expected clang++ at $llvmBin"
          }
          # Forward slashes: this value reaches CMake through a bash step, where
          # backslashes would be read as escapes.
          echo "CXX=$($llvmBin -replace '\\','/')/clang++.exe" >> $env:GITHUB_ENV
          # Ahead of the Visual Studio LLVM directory for any later PATH lookup.
          echo $llvmBin >> $env:GITHUB_PATH
          & "$llvmBin\clang++.exe" --version
          # Report the OpenMP runtime up front: its absence is the difference
          # between this toolchain and the Visual Studio one, and it would
          # otherwise only surface as a confusing link error much later.
          Get-ChildItem "C:\Program Files\LLVM\lib\libomp.lib" -ErrorAction SilentlyContinue |
            ForEach-Object { "found $($_.FullName)" }

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-windows-2022-clang-Release-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER="${{ env.CXX }}"
          -DLINDBLAD_MARCH_NATIVE=ON
          -DLINDBLAD_BUILD_PYTHON=OFF

      # Same reasoning as the matrix job's copy of this step.
      - name: Dump CMake configure log (on failure)
        if: failure()
        shell: bash
        run: |
          for f in build/CMakeFiles/CMakeConfigureLog.yaml \
                   build/CMakeFiles/CMakeError.log \
                   build/CMakeFiles/CMakeOutput.log; do
            echo "===================== $f ====================="
            if [ -f "$f" ]; then cat "$f"; else echo "(not present)"; fi
          done

      - name: Build
        shell: bash
        run: cmake --build build --parallel -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

  # Repository hygiene. No compiler, no dependencies, seconds to run.
  #
  # .gitattributes states the LF policy and git enforces it in one place: the
  # conversion applied when content moves between the working tree and the
  # object database. That is real, but it is a single line acting at commit
  # time, and it is invisible while it works. This job reads the bytes off disk
  # and decides independently, so a file that arrives by some other route, or a
  # path whose attributes changed, is still reported. The same script runs
  # locally as a ctest case.
  line-endings:
    name: line endings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check tracked files against the LF policy
        run: python3 tools/check_line_endings.py

  # Coverage report, published as a downloadable artifact so the number is
  # tracked per release instead of measured by hand.
  #
  # A separate job rather than a seventh matrix leg: LINDBLAD_BUILD_COVERAGE
  # forces -O0 -g for exact line attribution, which would change what the Debug
  # and Release legs measure and slow them down for nothing. Mirrors the
  # invocation documented in docs/BuildAndTest.md.
  coverage:
    name: coverage (gcovr)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 gcovr
          gcovr --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build-cov/_deps
          key: deps-coverage-ubuntu-24.04-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build-cov -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DLINDBLAD_BUILD_COVERAGE=ON
          -DLINDBLAD_MARCH_NATIVE=ON
          -DLINDBLAD_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build-cov --parallel -- -k 0

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      # --gcov-executable must match the compiler: gcov 14 (the Ubuntu 24.04
      # default) cannot read notes written by GCC 13, and reports every line as
      # uncovered rather than failing, so a mismatch looks like a coverage
      # collapse instead of a tooling error.
      #
      # The filters keep the report to shipped code. Without them the number is
      # diluted by the test tree itself and by everything FetchContent pulls
      # into build-cov/_deps.
      - name: Report
        run: |
          gcovr -r . build-cov \
            --gcov-executable gcov-13 \
            --filter src/ --filter include/ \
            --html-details build-cov/coverage.html \
            --txt build-cov/coverage.txt \
            --print-summary
          echo "::group::coverage.txt"
          cat build-cov/coverage.txt
          echo "::endgroup::"

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            build-cov/coverage*.html
            build-cov/coverage*.css
            build-cov/coverage.txt
          if-no-files-found: error
