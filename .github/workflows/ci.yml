# Core CI matrix: [GCC 13, Clang 18] x [Debug, Release] on Ubuntu 24.04.
# Mirrors the README's standard build settings EXCEPT the -march choice:
# hosted runners span hardware generations, so CI builds the pinned
# x86-64-v3 baseline (the LINDBLAD_MARCH_NATIVE=OFF default) instead of
# -march=native — otherwise numerical results would vary run-to-run with
# the machine the job happens to land on. Every dependency is fetched by
# CMake (FetchContent), so the runner only needs compilers + ninja + the
# clang OpenMP runtime (GCC bundles libgomp; clang's libomp is separate).
# Later increments (tracked in the CI issue): Windows/macOS runners, a gcovr
# coverage artifact, a clang-format + clang-tidy gate, release automation.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, clang-18]
        build_type: [Debug, Release]
        include:
          - compiler: gcc-13
            cxx: g++-13
            cxx_flags: ""
          - compiler: clang-18
            cxx: clang++-18
            # Clang-only diagnostic knob from the standard build settings;
            # GCC has no such flag, so it is scoped to the clang jobs.
            cxx_flags: "-Wno-nan-infinity-disabled"

    steps:
      # v5 majors of checkout/cache are the Node 24 runtime switch (Node 20
      # is deprecated on runners: default flips 2026-06-16, removed fall
      # 2026). Deliberately the lowest Node-24 majors, not the newest ones:
      # their only breaking change is the runtime.
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 clang-18 libomp-18-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DLINDBLAD_MARCH_NATIVE=OFF
          -DLINDBLAD_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
